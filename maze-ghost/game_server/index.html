<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clearpath</title>
  <style>
    :root { --ink: #e8eef8; --muted: #93a3bb; --panel: rgba(10, 14, 22, 0.8); --line: rgba(255,255,255,0.1); --accent: #5ab0ff; --danger: #ff5a6e; --gold: #ffd166; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #06090f; color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
    #view { position: fixed; inset: 0; }
    #view canvas { display: block; touch-action: none; }
    /* No backdrop-filter: blurring the 3D view behind each panel is redone every frame and costs a lot on Chromebooks. */
    .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
    #fps { position: fixed; top: 6px; right: 8px; z-index: 10; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,0.6); color: #9fe; font: 11px/1.4 ui-monospace, Consolas, monospace; pointer-events: none; }

    #hud { top: 16px; left: 16px; width: 320px; padding: 12px 14px; }
    #hud h1 { margin: 0 0 2px; font-size: 17px; }
    #depth { color: var(--muted); margin-bottom: 6px; }
    #depth b { color: var(--danger); }
    #message { min-height: 1.4em; }
    #status { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    #status[hidden] { display: none; }
    .chip { padding: 2px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); color: var(--muted); }
    .chip.warn { color: var(--danger); border-color: rgba(255, 90, 110, 0.45); }
    .chip.ok { color: #4ade80; border-color: rgba(74, 222, 128, 0.45); }
    .chip.vent { color: #2ee6c8; border-color: rgba(46, 230, 200, 0.5); }
    #thinking em.habit { font-style: normal; font-size: 11px; padding: 0 5px; border-radius: 4px; background: rgba(255, 59, 92, 0.25); color: #ffb3c0; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; color: var(--muted); font-size: 12px; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
    #thinking { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
    #thinking { min-height: 96px; }
    #thinking .title { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    #thinking .opt { display: grid; grid-template-columns: minmax(70px, auto) 1fr auto; gap: 8px; padding: 2px 6px; border-radius: 6px; color: var(--muted); }
    #thinking .opt.chosen { color: var(--ink); background: rgba(255, 90, 110, 0.18); }

    #help { bottom: 16px; left: 50%; transform: translateX(-50%); padding: 8px 14px; color: var(--muted); font-size: 13px; white-space: nowrap; }

    #pad { position: fixed; right: 16px; bottom: 16px; display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 6px; }
    #pad button { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); font-size: 20px; cursor: pointer; touch-action: manipulation; }
    #pad button:active { background: rgba(90, 176, 255, 0.3); }
    #pad [data-dir="up"] { grid-area: 1 / 2; } #pad [data-dir="left"] { grid-area: 2 / 1; }
    #pad [data-dir="right"] { grid-area: 2 / 3; } #pad [data-dir="down"] { grid-area: 3 / 2; }

    #overlay { position: fixed; inset: 0; display: none; place-items: center; background: rgba(4, 6, 10, 0.55); padding: 16px; }
    #overlay.show { display: grid; }
    #overlay .card { position: static; text-align: center; max-width: 380px; padding: 22px 26px; }
    #overlay h2 { margin: 0 0 6px; font-size: 24px; }
    #overlay p { margin: 0 0 16px; color: var(--muted); }
    #overlay .card { max-width: 440px; }
    #overlay p.hint { margin-top: -6px; padding: 8px 12px; border-radius: 8px; background: rgba(255, 209, 102, 0.12); color: var(--gold); text-align: left; font-size: 13px; }
    #overlay button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 10px; border: 0; background: var(--accent); color: #04121f; cursor: pointer; }

    @media (max-width: 820px) {
      #hud { left: 12px; right: 12px; top: 12px; width: auto; padding: 10px 12px; font-size: 13px; }
      #hud h1 { font-size: 15px; }
      #thinking .opt { grid-template-columns: minmax(58px, auto) 1fr auto; }
      #help { display: none; }
      #pad { left: 50%; right: auto; transform: translateX(-50%); bottom: 12px; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@600;700;800&family=Special+Elite&family=Silkscreen&family=VT323&family=Orbitron:wght@600;700;800&family=Courier+Prime:wght@400;700&family=Libre+Baskerville:wght@400;700&family=Bebas+Neue&display=swap" />
  <link rel="stylesheet" href="./basement.css" />
  <link rel="stylesheet" href="./server-halls.css" />
  <link rel="stylesheet" href="./core.css" />
  <link rel="stylesheet" href="./vault.css" />
  <link rel="stylesheet" href="./archive.css" />
  <link rel="stylesheet" href="./uplink.css" />
  <link rel="stylesheet" href="./cutscene.css" />
  <link rel="stylesheet" href="./title-screen.css" />
  <link rel="stylesheet" href="./prologue.css" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="view"></div>
  <div id="mood" aria-hidden="true"></div>
  <div id="fps" hidden></div>

  <div id="hud" class="panel">
    <h1 id="level-name">Level 1</h1>
    <div id="depth">Ghost looks <b>1 move</b> ahead</div>
    <div id="status" hidden></div>
    <div id="message">Reach the green exit. The ghost moves after you.</div>
    <div class="legend">
      <span><span class="dot" style="background:var(--accent)"></span>You</span>
      <span><span class="dot" style="background:var(--danger)"></span><span id="legend-enemy">Ghost's plan</span></span>
      <span><span class="dot" style="background:var(--gold)"></span>Moves they predict you'll make</span>
      <span id="legend-vent" hidden><span class="dot" style="background:#2ee6c8"></span>Vent: step on a grate, come out of its twin</span>
    </div>
    <div id="thinking"></div>
  </div>

  <div id="help" class="panel">Arrows / WASD move · R restart · M menu</div>

  <div id="pad" aria-label="Move controls">
    <button data-dir="up" aria-label="Up">↑</button>
    <button data-dir="left" aria-label="Left">←</button>
    <button data-dir="right" aria-label="Right">→</button>
    <button data-dir="down" aria-label="Down">↓</button>
  </div>

  <div id="overlay"><div class="card panel"><h2 id="overlay-title"></h2><p id="overlay-text"></p><p id="overlay-hint" class="hint" hidden></p><button id="overlay-btn"></button></div></div>

  <script type="module" src="./three-view.js"></script>
</body>
</html>
