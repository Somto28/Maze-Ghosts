  </defs>
  <rect width="32" height="32" rx="6" fill="#0b0e14"/>
  <rect x="20" y="3" width="2" height="6" fill="#4a5262"/>
  <rect x="19" y="1" width="4" height="3" fill="#ff3b4a"/>
  <rect x="11" y="27" width="10" height="3" fill="#20252f"/>
  <rect x="3" y="9" width="26" height="18" fill="#3a4150"/>
  <rect x="3" y="9" width="26" height="2" fill="#5b6578"/>
  <rect x="3" y="25" width="26" height="2" fill="#262b36"/>
  <rect x="6" y="13" width="20" height="10" fill="#06080b"/>
  <ellipse cx="16" cy="18" rx="9" ry="6" fill="url(#glow)" shape-rendering="auto"/>
